id: prometheus
version: 1.0.0
name: Prometheus
icon: prometheus.svg
category: monitoring
inputs:
    - key: prometheus_version
      type: select
      options: ["v3.1.0", "v2.55.1"]
      label: Version
      defaultValue: v3.1.0
      immutable: true
    - key: scrape_interval
      type: text
      label: Scrape Interval
      defaultValue: 15s

container:
    dockerImage: prom/prometheus:${{ inputs.prometheus_version }}
    port: 9090
    volumes:
        - name: prometheus_config
          mount: /etc/prometheus
          type: managed
          files:
              - path: prometheus.yml
                content: |
                    global:
                      scrape_interval: ${{ inputs.scrape_interval }}

                    scrape_configs:
                      - job_name: prometheus
                        static_configs:
                          - targets: ["localhost:9090"]
        - name: prometheus_data
          mount: /prometheus

outputs:
    - key: dashboard_url
      label: Dashboard URL
      value: http://${{ runtime.host }}:${{ container.port }}
