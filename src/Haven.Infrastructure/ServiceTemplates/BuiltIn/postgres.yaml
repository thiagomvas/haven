id: postgres
version: 1.0.0
name: PostgreSQL
icon: postgres.svg
category: database
inputs:
    - key: postgres_version
      type: select
      options: ["15", "16", "17"]
      label: Version
      defaultValue: "17"
      immutable: true
    - key: postgres_user
      type: text
      label: User
      defaultValue: postgres
    - key: postgres_password
      type: secret
      label: Password
      immutable: true
    - key: postgres_database
      type: text
      label: Database
      defaultValue: postgres

container:
    dockerImage: postgres:${{ inputs.postgres_version }}-alpine
    env:
        POSTGRES_USER: ${{ inputs.postgres_user }}
        POSTGRES_PASSWORD: ${{ inputs.postgres_password }}
        POSTGRES_DB: ${{ inputs.postgres_database }}
    volumes:
        - name: postgres_data
          mount: /var/lib/postgresql/data
