id: redis
version: 1.0.0
name: Redis
icon: redis.svg
category: database
inputs:
    - key: redis_version
      type: select
      options: ["6", "7"]
      label: Version
      defaultValue: "7"
      immutable: true
    - key: redis_password
      type: secret
      label: Password

container:
    dockerImage: redis:${{ inputs.redis_version }}-alpine
    env:
        REDIS_PASSWORD: ${{ inputs.redis_password }}
    commandArgs:
        - --requirepass
        - ${{ inputs.redis_password }}
    port: 6379
    volumes:
        - name: redis_data
          mount: /data

outputs:
    - key: connection_string
      label: Connection String
      secret: true
      value: redis://:${{ env.REDIS_PASSWORD | urlencode }}@${{ runtime.host }}:${{ container.port }}
