name: Security Audit

on:
  schedule:
    - cron: '0 8 * * 1' # Every Monday at 8:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: security-audit
  cancel-in-progress: true

jobs:
  audit:
    name: Audit Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Audit .NET packages
        id: dotnet
        run: |
          OUTPUT=$(dotnet list package --vulnerable --include-transitive 2>&1)
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -q "has the following vulnerable packages"; then
            echo "vulnerable=true" >> "$GITHUB_OUTPUT"
            {
              echo 'report<<AUDIT_EOF'
              echo "$OUTPUT"
              echo 'AUDIT_EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "vulnerable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install npm dependencies
        working-directory: src/Presentation/Haven.Web
        run: npm ci

      - name: Audit npm packages
        id: npm
        working-directory: src/Presentation/Haven.Web
        run: |
          AUDIT_JSON=$(npm audit --json 2>/dev/null || true)
          TOTAL=$(echo "$AUDIT_JSON" | jq -r '
            .metadata.vulnerabilities |
            (.info // 0) + (.low // 0) + (.moderate // 0) + (.high // 0) + (.critical // 0)
          ' 2>/dev/null || echo "0")

          if [ "$TOTAL" -gt 0 ]; then
            echo "vulnerable=true" >> "$GITHUB_OUTPUT"
            HUMAN=$(npm audit 2>&1 || true)
            {
              echo 'report<<AUDIT_EOF'
              echo "$HUMAN"
              echo 'AUDIT_EOF'
            } >> "$GITHUB_OUTPUT"
          else
            echo "vulnerable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure labels exist
        if: steps.dotnet.outputs.vulnerable == 'true' || steps.npm.outputs.vulnerable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "security" --color "e11d48" --description "Security related" 2>/dev/null || true
          gh label create "security-audit" --color "f97316" --description "Automated security audit finding" 2>/dev/null || true

      - name: Build issue body
        if: steps.dotnet.outputs.vulnerable == 'true' || steps.npm.outputs.vulnerable == 'true'
        run: |
          {
            echo "## Security Audit Report"
            echo ""
            echo "Automated security audit found vulnerabilities on **$(date +'%Y-%m-%d')** (commit [\`${GITHUB_SHA::7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}))."
            echo ""

            if [ "${{ steps.dotnet.outputs.vulnerable }}" == "true" ]; then
              echo "### .NET Vulnerable Packages"
              echo ""
              echo '```'
              echo "${{ steps.dotnet.outputs.report }}"
              echo '```'
              echo ""
            fi

            if [ "${{ steps.npm.outputs.vulnerable }}" == "true" ]; then
              echo "### npm Vulnerable Packages"
              echo ""
              echo '```'
              echo "${{ steps.npm.outputs.report }}"
              echo '```'
              echo ""
            fi

            echo "---"
            echo "*Generated by the [Security Audit workflow](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})*"
          } > issue_body.md

      - name: Close previous open audit issues
        if: steps.dotnet.outputs.vulnerable == 'true' || steps.npm.outputs.vulnerable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OPEN=$(gh issue list --label "security-audit" --state open --json number --jq '.[].number')
          for num in $OPEN; do
            gh issue close "$num" --comment "Superseded by a new audit run."
          done

      - name: Open issue with findings
        if: steps.dotnet.outputs.vulnerable == 'true' || steps.npm.outputs.vulnerable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "[Security Audit] Vulnerabilities found — $(date +'%Y-%m-%d')" \
            --body-file issue_body.md \
            --label "security,security-audit"

      - name: Fail if vulnerabilities found
        if: steps.dotnet.outputs.vulnerable == 'true' || steps.npm.outputs.vulnerable == 'true'
        run: |
          echo "::error::Security vulnerabilities were found. See the opened GitHub issue for details."
          exit 1
