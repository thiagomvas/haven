name: Deploy - Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to deploy (MAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH)'
        required: true
        type: string
      dry_run:
        description: 'Dry run — build the image but do not push'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: deploy-release
  cancel-in-progress: false

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-restore --no-build --configuration Release --filter "Category=Unit"

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Install dependencies
        working-directory: src/Presentation/Haven.Web
        run: npm ci

      - name: Build
        working-directory: src/Presentation/Haven.Web
        run: npm run build

  publish:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test-backend, test-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: |
          RAW="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}"
          VERSION="${RAW#v}"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ !inputs.dry_run }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/haven:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/haven:${{ steps.version.outputs.value }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event_name == 'workflow_dispatch' && github.event.created_at || github.event.release.published_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
